<style>
  .t-card {
    position: absolute; left: 50%; top: 80px; transform: translateX(-50%);
    width: 900px; padding: 28px 36px; border-radius: 20px;
    background: rgba(15, 17, 21, 0.9); border: 2px solid #4c8dff;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    font-family: "Segoe UI", Arial, sans-serif; color: #fff;
  }
  .t-title { text-align: center; font-size: 34px; font-weight: 800; letter-spacing: 3px; color: #4c8dff; }
  .t-row { display: flex; align-items: center; justify-content: space-between; margin-top: 22px; }
  .t-side { display: flex; align-items: center; gap: 16px; width: 380px; font-size: 36px; font-weight: 700; }
  .t-side.t-red { flex-direction: row-reverse; text-align: right; color: #ff6b6b; }
  .t-side.t-blue { color: #5aa9ff; }
  .t-logo { width: 84px; height: 84px; object-fit: contain; }
  .t-vs { font-size: 28px; color: #8a91a3; }
  .t-players { display: flex; justify-content: space-between; margin-top: 20px; font-size: 22px; color: #cfd4e0; }
  .t-col div { margin-top: 4px; }
  .t-col.t-right { text-align: right; }
  .t-foot { margin-top: 18px; text-align: center; font-size: 20px; color: #8a91a3; }
</style>

<div class="t-card">
  <div class="t-title">OVERLAY PIPELINE OK</div>

  <div class="t-row">
    <div class="t-side t-blue">
      <img class="t-logo" data-src="blue.logo" alt="">
      <span data-bind="blue.name"></span>
    </div>
    <div class="t-vs">VS</div>
    <div class="t-side t-red">
      <img class="t-logo" data-src="red.logo" alt="">
      <span data-bind="red.name"></span>
    </div>
  </div>

  <div class="t-players">
    <div class="t-col">
      <div data-bind="blue.player1.ign"></div>
      <div data-bind="blue.player2.ign"></div>
      <div data-bind="blue.player3.ign"></div>
      <div data-bind="blue.player4.ign"></div>
      <div data-bind="blue.player5.ign"></div>
    </div>
    <div class="t-col t-right">
      <div data-bind="red.player1.ign"></div>
      <div data-bind="red.player2.ign"></div>
      <div data-bind="red.player3.ign"></div>
      <div data-bind="red.player4.ign"></div>
      <div data-bind="red.player5.ign"></div>
    </div>
  </div>

  <div class="t-foot">Series: <span data-bind="series.format"></span></div>
</div>
